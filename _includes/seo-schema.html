{% if page.url == "/" or page.url == "/index.html" or page.url == "/about/" or page.url == "/about.html" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LocalBusiness",
  "@id": "{{ site.url }}{{ site.baseurl }}/#organization",
  "name": "{{ site.title | escape }}",
  "url": "{{ site.url }}{{ site.baseurl }}/",
  "logo": "{{ site.url }}{{ site.baseurl }}/{{ site.logo.desktop }}",
  "description": "{{ page.description | default: site.description | escape }}",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "64 W 6th St",
    "addressLocality": "Gilroy",
    "addressRegion": "CA",
    "postalCode": "95020",
    "addressCountry": "US"
  },
  "contactPoint": {
    "@type": "ContactPoint",
    "telephone": "{{ site.data.contact.phone }}",
    "contactType": "customer service"
  },
  "sameAs": [
    {% assign social_links = site.data.social | where_exp: "item", "item.link contains 'http'" %}{% for item in social_links %}"{{ item.link }}"{% unless forloop.last %},{% endunless %}{% endfor %}
  ],
  {% assign founder = site.team | where: "title", "Shawna Scott" | first %}
  {% if founder %}
  "founder": {
    "@type": "Person",
    "@id": "{{ site.url }}{{ site.baseurl }}{{ founder.url | relative_url }}#person",
    "name": "{{ founder.title | escape }}",
    "jobTitle": "{{ founder.jobtitle | escape }}",
    "image": "{{ site.url }}{{ site.baseurl }}/{{ founder.image }}"
  }
  {% endif %}
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "@id": "{{ site.url }}{{ site.baseurl }}/#website",
  "name": "{{ site.title | escape }}",
  "url": "{{ site.url }}{{ site.baseurl }}/",
  "publisher": {
    "@id": "{{ site.url }}{{ site.baseurl }}/#organization"
  }
}
</script>
{% endif %}

{% if page.layout == "class" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Course",
  "name": "{{ page.title | escape }}",
  "description": "{{ content | strip_html | truncatewords: 50 | escape }}",
  "provider": {
    "@id": "{{ site.url }}{{ site.baseurl }}/#organization"
  },
  "offers": [{
    "@type": "Offer",
    "category": "Paid"
  }]
}
</script>
{% endif %}

{% if page.layout == "team" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "@id": "{{ site.url }}{{ site.baseurl }}{{ page.url | relative_url }}#person",
  "name": "{{ page.title | escape }}",
  "jobTitle": "{{ page.jobtitle | escape }}",
  "image": "{{ site.url }}{{ site.baseurl }}/{{ page.image }}",
  "worksFor": {
    "@id": "{{ site.url }}{{ site.baseurl }}/#organization"
  },
  "description": "{{ content | strip_html | truncatewords: 50 | escape }}"
}
</script>
{% endif %}
